name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: go build ./...
      - name: Test (race)
        shell: bash
        run: go test -race ./...
      - name: Coverage gate
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-coverage.sh
