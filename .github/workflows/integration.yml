name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly: also catches /debug shape drift on headscale main

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        headscale: ['0.29.6', 'main']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests
        env:
          HEADSCALE_IMAGE_TAG: ${{ matrix.headscale }}
        run: make test-integration
