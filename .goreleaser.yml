version: 2

env:
  - CGO_ENABLED=0

builds:
  - binary: headsup
    main: ./cmd/headsup
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tonhe/headsup/internal/version.Version={{.Version}}
      - -X github.com/tonhe/headsup/internal/version.Commit={{.ShortCommit}}
      - -X github.com/tonhe/headsup/internal/version.Build={{.Date}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^Merge pull request"]

nfpms:
  - package_name: headsup
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: tonhe
    homepage: https://github.com/tonhe/headsup
    maintainer: tonhe
    description: Terminal UI for administering headscale
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin

brews:
  - name: headsup
    repository:
      owner: tonhe
      name: homebrew-tap
      # Installation token for the release GitHub App, minted in release.yml.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/tonhe/headsup
    description: Terminal UI for administering headscale
    license: MIT

# Scoop (Windows) is off until a tonhe/scoop-bucket repo exists.
# scoops:
#   - name: headsup
#     repository:
#       owner: tonhe
#       name: scoop-bucket
#     homepage: https://github.com/tonhe/headsup
#     description: Terminal UI for administering headscale
#     license: MIT

release:
  github:
    owner: tonhe
    name: headsup
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto
